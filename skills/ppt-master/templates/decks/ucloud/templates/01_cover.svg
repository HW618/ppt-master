<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  font-family="Arial, Microsoft YaHei, Source Han Sans CN Normal, sans-serif"
  data-pptx-master="ucloud_master" data-pptx-master-name="UCloud Master"
  data-pptx-layout="cover_dark" data-pptx-layout-name="Dark Cover">
  <rect id="ucloud-master-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <rect id="layout-cover-bg" x="0" y="0" width="1280" height="720" fill="#3860F4"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="layout-cover-art" x="0" y="0" width="1280" height="720"
    href="../images/bg_cover_dark.png" preserveAspectRatio="xMidYMid slice"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="layout-cover-logo" x="1016" y="32" width="228" height="28"
    href="../images/logo_ucloud_white.png" preserveAspectRatio="xMidYMid meet"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="layout-cover-stock" x="1244" y="84" text-anchor="end"
    fill="#EBF0FC" fill-opacity="0.90" font-size="14"
    data-pptx-layer="layout" data-pptx-editable="false">科创板上市 · 股票代码：688158</text>
  <line id="layout-cover-divider" x1="1144" y1="376" x2="1244" y2="376"
    stroke="#FFCF87" stroke-width="3"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="444 272 800 92">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="1244" y="338" text-anchor="end" fill="#FFFFFF"
      font-family="Arial Black, Microsoft YaHei, Arial, sans-serif"
      font-size="48" font-weight="700">{{TITLE}}</text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="484 392 760 72">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="1244" y="428" text-anchor="end" fill="#EBF0FC"
      font-size="24">{{SUBTITLE}}</text>
  </g>
  <g id="cover-author-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="564 568 680 40">
    <text id="cover-author-carrier" data-pptx-carrier="true"
      x="1244" y="594" text-anchor="end" fill="#FFFFFF" fill-opacity="0.92"
      font-size="18">{{AUTHOR}}</text>
  </g>
  <g id="cover-date-slot" data-pptx-placeholder="date" data-pptx-idx="3"
    data-pptx-bounds="564 612 680 36">
    <text id="cover-date-carrier" data-pptx-carrier="true"
      x="1244" y="635" text-anchor="end" fill="#E5EAFF" fill-opacity="0.80"
      font-size="16">{{DATE}}</text>
  </g>
</svg>
